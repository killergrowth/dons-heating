name: Notify Agent Log Writer

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check commit message
        id: check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          # Skip internal/tooling commits
          if echo "$MSG" | grep -qiE '^(feat|fix|chore|ci|docs|refactor|test|style|build)\:'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping internal commit: $MSG"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build deploy summary
        id: summary
        if: steps.check.outputs.skip == 'false'
        run: |
          MSG="${{ github.event.head_commit.message }}"
          CHANGED="${{ join(github.event.head_commit.modified, ', ') }}"
          # Collapse to first line only to keep the summary short and avoid
          # any multi-line/heredoc edge cases downstream (JSON payload, Slack, etc.)
          FIRST_LINE=$(printf '%s\n' "$MSG" | head -n 1)
          SUMMARY="Deployed to production. ${FIRST_LINE}${CHANGED:+ | Files: ${CHANGED}}"
          {
            echo "summary<<SUMMARY_EOF"
            echo "$SUMMARY"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch to reporting repo
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.KILLERGROWTH_REPO_TOKEN }}
          repository: killergrowth/killergrowth-reporting
          event-type: agent-log-deploy
          client-payload: |
            {
              "client": "dons-heating",
              "agent": "Brickley Jr",
              "summary": "${{ steps.summary.outputs.summary }}"
            }